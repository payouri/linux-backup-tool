[package]
name = "linux-backup-core"
version.workspace = true
edition.workspace = true
description = "linux-backup domain logic: Selection model, scanning, crypto, manifest, archive, restore. Zero UI dependencies (ADR-0001) — must never depend on inquire, ratatui, or any terminal/rendering crate."

[dependencies]
thiserror = "2.0.18"
walkdir = "2.5.0"
tar = "0.4.44"
zstd = "0.13.3"
sha2 = "0.10.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
# The Profile is persisted as `profile.toml`; `toml` is the de-facto serde TOML backend and
# the exact crate issue #17's Crate choices ("`toml` for the Profile") and docs/research/
# rust-crates.md's serde-first pattern call for. `serde` (already a dep) provides the derive;
# this adds only the TOML format layer.
toml = "0.8"
sysinfo = { version = "0.39", default-features = false, features = ["disk"] }
# Reference Rust impl of the age format (str4d, the spec author); passphrase (scrypt)
# whole-stream encryption via `Encryptor::with_user_passphrase`, no key management needed
# for the alpha's passphrase-only scope. Recommended in docs/research/rust-crates.md.
age = "0.12.1"
# `age::Encryptor::with_user_passphrase` takes a `secrecy::SecretString`; carrying the
# passphrase in `SecretString` rather than a plain `String` keeps it zeroized on drop and
# out of `Debug` output end-to-end, not just at the age API boundary. Same recommendation
# as docs/research/rust-crates.md, pinned to 0.10 (not the doc's "0.8") because age-core
# 0.12.0 itself depends on secrecy 0.10 — using 0.8 here would resolve two separate
# `secrecy` crate instances and make our `SecretString` a different type than the one
# `with_user_passphrase` expects.
secrecy = "0.10"

[dev-dependencies]
tempfile = "3.15.0"
libc = "0.2"
