  frontend build step the Rust gates should not need (issue #99's walking-skeleton gotcha).

  `crates/gui/ui/.gitignore` ignores `dist/` like any generated Vite output, so this one
  file is force-added (`git add -f`) to be the sole tracked exception — everything else a
  real build drops in here (JS/CSS bundles, fonts, ...) stays untracked and ignored.

  Run `npm install && npm run build` in `crates/gui/ui/` to overwrite this with the real
  Vite build before `cargo tauri dev` / `cargo tauri build` (a real window needs real
  assets); that overwrite then shows up as a local modification to this tracked file —
  restore it (`git checkout -- dist/index.html`) rather than committing the real build.
-->
