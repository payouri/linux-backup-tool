[package]
name = "tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "linux-backup's inquire-based terminal wizard: a thin view over core's SelectionModel, owning only cursor/scroll state and rendering."

[lints]
workspace = true

[[bin]]
name = "linux-backup"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.103"
linux_backup_core = { path = "../core", package = "linux-backup-core" }
inquire = "0.9.4"
# `age::Encryptor::with_user_passphrase` (in `core`) takes a `secrecy::SecretString`; this
# crate needs the same type to carry the passphrase from `inquire::Password` into
# `core::restore::restore` without ever touching it as a plain `String`. Same version core
# pins, so the two crates share one `secrecy` instance rather than resolving two.
secrecy = "0.10"
# The only way to reach `getuid()`/`geteuid()` (real uid + effective-root check for building
# a real `RunContext`, issue #29) from Rust without a heavier crate. Already a `core`
# dev-dependency for the same probe in a test; `tui`, unlike `core`, carries no
# `forbid(unsafe_code)`, so it can use it directly rather than shelling out to `id -u`.
libc = "0.2"
# The de-facto Rust progress-bar crate (console-rs, the same org behind `dialoguer`;
# ~350M downloads, actively maintained) — drives story 37's live per-phase RUN bars from
# `core::progress`'s `on_phase`/`on_entry` callbacks. Chosen over hand-rolling carriage-return
# terminal control (error-prone, no width/terminal-detection handling) for the one place the
# alpha needs a real live bar; `inquire` already pulls in `console`'s sibling `crossterm`, so
# this adds no genuinely new terminal-handling surface.
indicatif = "0.17"

[dev-dependencies]
tempfile = "3.15.0"
