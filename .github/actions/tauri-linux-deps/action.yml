---
name: Install Tauri Linux build dependencies
description: >
  Tauri v2's documented Ubuntu/Debian build prerequisites — the system libraries the GUI
  crate's transitive -sys crates (webkit2gtk, gtk3, glib/gio, soup3, appindicator) resolve
  through pkg-config at build-script time. Factored out because `crates/gui` is a workspace
  member, so every job that touches the workspace needs the identical set: without it even
  `cargo check --workspace` dies in `gio-sys`'s build script with "glib-2.0.pc needs to be
  installed", which is not a code failure and reads as one.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libjavascriptcoregtk-4.1-dev \
          libgtk-3-dev \
          librsvg2-dev \
          libssl-dev \
          libayatana-appindicator3-dev
