name: CI

on:
  pull_request:
    # opened / synchronize (new pushes to the PR head) / reopened are the default set;
    # listed explicitly so the intent survives a future edit.
    types: [opened, synchronize, reopened]
  push:
    branches: [trunk]

# Newer commits on the same ref supersede in-progress runs; trunk pushes are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: the pipeline only reads the checked-out code.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Fail the build on any Rust warning without threading -D through each step.
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
      - uses: ./.github/actions/tauri-linux-deps
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: ./.github/actions/tauri-linux-deps
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --all-targets --locked

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `crates/gui/ui` is a React app with its own lint (oxlint), type-check (`tsc -b`, run by
    # `npm run build`) and test (vitest) toolchain. No cargo gate reaches any of it, and
    # `packaging.yml` only builds the frontend on GUI-path changes as a step towards an
    # artifact -- so without this job a broken or failing frontend lands green.
    # Belongs here rather than in `packaging.yml` for the reason that workflow's own header
    # draws: these are fast source gates ("the change is wrong"), not artifact builds.
    env:
      # The workflow-level `-D warnings` is for rustc; nothing in this job runs it.
      RUSTFLAGS: ""
    defaults:
      run:
        working-directory: crates/gui/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same three inputs as `packaging.yml`'s appimage job, for the same reason: `.nvmrc` is
      # the single source of the Node major, and both paths are repo-root-relative regardless
      # of the `working-directory` above.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: crates/gui/ui/.nvmrc
          cache: npm
          cache-dependency-path: crates/gui/ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      # Type-check and bundle in one step -- `build` is `tsc -b && vite build`. Overwrites the
      # tracked `dist/index.html` placeholder, which is fine on a throwaway runner checkout.
      - run: npm run build

  msrv:
    name: msrv (1.95)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Enforces the declared rust-version floor (Cargo.toml / clippy.toml). Compile-only via
    # cargo check, and without -D warnings, so a lint that differs between 1.95 and stable
    # can't fail the floor -- this job answers "does it still build on 1.95?", nothing more.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `toolchain:` must be spelled out. dtolnay/rust-toolchain normally takes the version from
      # the ref you call it by (`@1.95.0`), but pinning to a commit SHA leaves nothing to read it
      # from and the input falls back to its `stable` default -- which is what this job silently
      # did before, re-running the `test` job's toolchain and enforcing no floor at all.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch; toolchain pinned below
        with:
          toolchain: 1.95.0
      - uses: ./.github/actions/tauri-linux-deps
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --workspace --all-targets --locked
